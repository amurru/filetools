name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  gui:
    name: Build and test the graphical interface
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Gio needs the windowing and the graphics libraries of the platform.
      # On Linux they are pulled in through cgo.
      - name: Install the graphical dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc pkg-config \
            libegl-dev libgles-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev libx11-xcb-dev libxcursor-dev libxfixes-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libegl1 libgl1-mesa-dri

      - name: Vet
        run: go vet -tags gui ./...

      - name: Build
        run: go build -tags gui ./...

      # The interface is rendered offscreen, so the tests need a software
      # renderer. The runner has no display, so EGL is used without a
      # surface.
      - name: Test
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: go test -tags gui -race ./...
